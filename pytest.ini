[pytest]
# Root pytest configuration so bare selectors work from the repository root:
#   pytest                                  # release packaging suite
#   pytest tests/release
#   pytest installer/tests/test_run_sh.py
#
# The service suites keep their own configuration and still run through
# `uv run pytest` inside src/<service> and installer/, because they need the
# aithena-common runtime dependencies that the root environment does not carry.
testpaths =
    tests/release
pythonpath =
    .
    scripts
    installer
addopts = --tb=short
