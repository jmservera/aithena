services:
  redis:
    image: redis:7.4-alpine
    command: >-
      redis-server /usr/local/etc/redis/redis.conf
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 15s
      retries: 1
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - redis
    volumes:
      - redis-data:/data
      - ./src/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  rabbitmq:
    image: rabbitmq:4.0-management
    entrypoint: /etc/rabbitmq/init-definitions.sh
    command: rabbitmq-server
    hostname: rabbitmq
    environment:
      # Admin user created on first Mnesia init (replaces default guest user)
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_ADMIN_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_ADMIN_PASS:-admin_dev_pass}
      # Per-service passwords --- init-definitions.sh reads these to generate
      # /etc/rabbitmq/definitions.json at startup (see load_definitions in rabbitmq.conf)
      - RABBITMQ_LISTER_PASS=${RABBITMQ_LISTER_PASS:-lister_dev_pass}
      - RABBITMQ_INDEXER_PASS=${RABBITMQ_INDEXER_PASS:-indexer_dev_pass}
      - RABBITMQ_SEARCH_PASS=${RABBITMQ_SEARCH_PASS:-search_dev_pass}
      - RABBITMQ_ADMIN_PASS=${RABBITMQ_ADMIN_PASS:-admin_dev_pass}
    expose:
      - 5672
      - 15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./src/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./src/rabbitmq/init-definitions.sh:/etc/rabbitmq/init-definitions.sh:ro

    healthcheck:
      test: ["CMD", "rabbitmqctl", "ping"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - rabbitmq
  embeddings-server:
    image: ghcr.io/jmservera/aithena-embeddings-server:${EMBEDDINGS_VERSION:-${VERSION:-latest}}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 2g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - embeddings-server
  tika:
    image: apache/tika:3.2.3.0-full
    expose:
      - "9998"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9998/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - tika
  document-lister:
    image: ghcr.io/jmservera/aithena-document-lister:${VERSION:-latest}
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_LISTER_USER:-lister}
      - RABBITMQ_PASS=${RABBITMQ_LISTER_PASS:-lister_dev_pass}
      - REDIS_HOST=redis
      - QUEUE_NAME=shortembeddings
      - EXCHANGE_NAME=documents
      - BASE_PATH=/data/documents/
      - DOCUMENT_WILDCARD=*.pdf
      - POLL_INTERVAL=60
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "document_lister"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - document-data:/data/documents
    networks:
      - default
  document-indexer:
    image: ghcr.io/jmservera/aithena-document-indexer:${VERSION:-latest}
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_INDEXER_USER:-indexer}
      - RABBITMQ_PASS=${RABBITMQ_INDEXER_PASS:-indexer_dev_pass}
      - REDIS_HOST=redis
      - QUEUE_NAME=shortembeddings
      - EXCHANGE_NAME=documents
      - BASE_PATH=/data/documents/
      - SOLR_HOST=solr
      - SOLR_PORT=8983
      - SOLR_COLLECTION=books
      - EMBEDDINGS_HOST=embeddings-server
      - EMBEDDINGS_PORT=8080
      - CHUNK_SIZE=300
      - CHUNK_OVERLAP=50
      - SOLR_AUTH_USER=${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      - SOLR_AUTH_PASS=${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
      - THUMBNAIL_DIR=/data/thumbnails
    restart: on-failure
    stop_grace_period: 10s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings-server:
        condition: service_healthy
      solr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "document_indexer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - document-data:/data/documents:ro
      - thumbnail-data:/data/thumbnails
    networks:
      - default
  solr-search:
    image: ghcr.io/jmservera/aithena-solr-search:${VERSION:-latest}
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      solr:
        condition: service_healthy
      embeddings-server:
        condition: service_healthy
      tika:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8080
      - SOLR_VERSION=${SOLR_VERSION:-10}
      - SOLR_URL=http://solr:8983/solr
      - SOLR_COLLECTION=books
      - BASE_PATH=/data/documents
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - EMBEDDINGS_URL=http://embeddings-server:8080/v1/embeddings/
      - VECTOR_QUANTIZATION=${VECTOR_QUANTIZATION:-none}
      - DEFAULT_SEARCH_MODE=keyword
      - UPLOAD_DIR=/data/documents/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_SEARCH_USER:-search}
      - RABBITMQ_PASS=${RABBITMQ_SEARCH_PASS:-search_dev_pass}
      - RABBITMQ_QUEUE_NAME=shortembeddings
      - E5_COLLECTIONS=books
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_DB_PATH=${AUTH_DB_PATH:-/data/auth/users.db}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?error Run ./installer/run.sh to generate secrets}
      - AUTH_JWT_TTL=${AUTH_JWT_TTL:-24h}
      - AUTH_COOKIE_NAME=${AUTH_COOKIE_NAME:-aithena_auth}
      - COLLECTIONS_DB_PATH=${COLLECTIONS_DB_PATH:-/data/collections/collections.db}
      - SOLR_AUTH_USER=${SOLR_READONLY_USER:?Set SOLR_READONLY_USER}
      - SOLR_AUTH_PASS=${SOLR_READONLY_PASS:?Set SOLR_READONLY_PASS}
    volumes:
      - document-data:/data/documents
      - collections-db:/data/collections
      - type: bind
        source: ${AUTH_DB_DIR:?AUTH_DB_DIR is not set. Run './installer/run.sh' to generate auth configuration}
        target: /data/auth
    networks:
      - default
  redis-commander:
    image: rediscommander/redis-commander:latest
    expose:
      - "8081"
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8081/admin/redis', (res) => process.exit(res.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - URL_PREFIX=/admin/redis
    networks:
      - default
  aithena-ui:
    image: ghcr.io/jmservera/aithena-aithena-ui:${VERSION:-latest}
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      solr-search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
  nginx:
    image: nginx:1.27-alpine
    entrypoint: ["/docker-entrypoint-solr-auth.sh"]
    command: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      aithena-ui:
        condition: service_healthy
      solr-search:
        condition: service_healthy
      redis-commander:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      SOLR_ADMIN_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_ADMIN_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
      NGINX_ENVSUBST_FILTER: SOLR_BASIC_AUTH
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./src/nginx/docker-entrypoint-solr-auth.sh:/docker-entrypoint-solr-auth.sh:ro
      - ./src/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./src/nginx/html:/usr/share/nginx/html:ro
      - document-data:/data/documents:ro
      - thumbnail-data:/data/thumbnails:ro
  zoo1:
    image: zookeeper:3.9
    command: ["zkServer.sh", "start-foreground"]
    expose:
      - "2181"
    networks:
      - default
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
      ZOO_CFG_EXTRA: "admin.enableServer=false"
      ZOO_MAX_CLIENT_CNXNS: "60"
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    volumes:
      - zoo-data1_logs:/logs
      - zoo-data1_data:/data
      - zoo-data1_datalog:/datalog
      - zoo-backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "printf ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  zoo2:
    image: zookeeper:3.9
    command: ["zkServer.sh", "start-foreground"]
    expose:
      - "2181"
    networks:
      - default
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
      ZOO_CFG_EXTRA: "admin.enableServer=false"
      ZOO_MAX_CLIENT_CNXNS: "60"
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    volumes:
      - zoo-data2_logs:/logs
      - zoo-data2_data:/data
      - zoo-data2_datalog:/datalog
      - zoo-backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "printf ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  zoo3:
    image: zookeeper:3.9
    command: ["zkServer.sh", "start-foreground"]
    expose:
      - "2181"
    networks:
      - default
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"
      ZOO_CFG_EXTRA: "admin.enableServer=false"
      ZOO_MAX_CLIENT_CNXNS: "60"
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    volumes:
      - zoo-data3_logs:/logs
      - zoo-data3_data:/data
      - zoo-data3_datalog:/datalog
      - zoo-backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "printf ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  solr:
    build:
      context: ./src/solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:10}
    user: "0:0"
    entrypoint: /entrypoint.sh
    command: ["solr-foreground"]
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - solr-data:/var/solr/data
      - document-data:/data/documents:ro
      - ./src/solr/entrypoint.sh:/entrypoint.sh:ro
    environment:
      SOLR_VERSION: ${SOLR_VERSION:-10}
      SOLR_MODULES: extraction,langid
      SOLR_OPTS: ${SOLR_OPTS:-} -Dsolr.cloud.overseer.enabled=${SOLR_CLOUD_OVERSEER_ENABLED:-false} -Dsolr.logs.dir=/var/solr/logs
      SOLR_SECURITY_MANAGER_ENABLED: "false"
      ZK_HOST: "zoo1:2181,zoo2:2181,zoo3:2181"
      SOLR_AUTH_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_AUTH_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
    expose:
      - "8983"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u $${SOLR_AUTH_USER}:$${SOLR_AUTH_PASS} http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      zoo1:
        condition: service_healthy
      zoo2:
        condition: service_healthy
      zoo3:
        condition: service_healthy
  solr2:
    build:
      context: ./src/solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:10}
    user: "0:0"
    entrypoint: /entrypoint.sh
    command: ["solr-foreground"]
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - solr-data2:/var/solr/data
      - document-data:/data/documents:ro
      - ./src/solr/entrypoint.sh:/entrypoint.sh:ro
    environment:
      SOLR_VERSION: ${SOLR_VERSION:-10}
      SOLR_MODULES: extraction,langid
      SOLR_OPTS: ${SOLR_OPTS:-} -Dsolr.cloud.overseer.enabled=${SOLR_CLOUD_OVERSEER_ENABLED:-false} -Dsolr.logs.dir=/var/solr/logs
      SOLR_SECURITY_MANAGER_ENABLED: "false"
      ZK_HOST: "zoo1:2181,zoo2:2181,zoo3:2181"
      SOLR_AUTH_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_AUTH_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
    expose:
      - "8983"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u $${SOLR_AUTH_USER}:$${SOLR_AUTH_PASS} http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      zoo1:
        condition: service_healthy
      zoo2:
        condition: service_healthy
      zoo3:
        condition: service_healthy
      solr:
        condition: service_healthy
  solr3:
    build:
      context: ./src/solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:10}
    user: "0:0"
    entrypoint: /entrypoint.sh
    command: ["solr-foreground"]
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - solr-data3:/var/solr/data
      - document-data:/data/documents:ro
      - ./src/solr/entrypoint.sh:/entrypoint.sh:ro
    environment:
      SOLR_VERSION: ${SOLR_VERSION:-10}
      SOLR_MODULES: extraction,langid
      SOLR_OPTS: ${SOLR_OPTS:-} -Dsolr.cloud.overseer.enabled=${SOLR_CLOUD_OVERSEER_ENABLED:-false} -Dsolr.logs.dir=/var/solr/logs
      SOLR_SECURITY_MANAGER_ENABLED: "false"
      ZK_HOST: "zoo1:2181,zoo2:2181,zoo3:2181"
      SOLR_AUTH_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_AUTH_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
    expose:
      - "8983"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u $${SOLR_AUTH_USER}:$${SOLR_AUTH_PASS} http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      zoo1:
        condition: service_healthy
      zoo2:
        condition: service_healthy
      zoo3:
        condition: service_healthy
      solr2:
        condition: service_healthy
  solr-init:
    build:
      context: ./src/solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:10}
    depends_on:
      solr:
        condition: service_healthy
      solr2:
        condition: service_healthy
      solr3:
        condition: service_healthy
    volumes:
      - ./src/solr/books:/configsets/books:ro
      - ./src/solr/add-conf-overlay.sh:/scripts/add-conf-overlay.sh:ro
    environment:
      SOLR_VERSION: ${SOLR_VERSION:-10}
      SOLR_SECURITY_MANAGER_ENABLED: "false"
      SOLR_ADMIN_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_ADMIN_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
      SOLR_READONLY_USER: ${SOLR_READONLY_USER:?Set SOLR_READONLY_USER}
      SOLR_READONLY_PASS: ${SOLR_READONLY_PASS:?Set SOLR_READONLY_PASS}
      SOLR_AUTH_USER: ${SOLR_ADMIN_USER:?Set SOLR_ADMIN_USER}
      SOLR_AUTH_PASS: ${SOLR_ADMIN_PASS:?Set SOLR_ADMIN_PASS}
      VECTOR_QUANTIZATION: ${VECTOR_QUANTIZATION:-none}
      SOLR_NUM_SHARDS: ${SOLR_NUM_SHARDS:-1}
      SOLR_REPLICATION_FACTOR: ${SOLR_REPLICATION_FACTOR:-3}
    entrypoint:
      - /bin/bash
      - -ceu
      - |
          set -o pipefail

          ZK_HOST="zoo1:2181,zoo2:2181,zoo3:2181"
          SOLR_URL="http://solr:8983"

          solr_major_version() {
            local version="$${SOLR_VERSION:-10}"
            printf '%s\n' "$${version%%.*}"
          }

          solr_10_cli() {
            [ "$$(solr_major_version)" -ge 10 ] 2>/dev/null
          }

          solr_zk_host_flag() {
            if solr_10_cli; then printf '%s\n' "--zk-host"; else printf '%s\n' "-z"; fi
          }

          solr_credentials_flag() {
            if solr_10_cli; then printf '%s\n' "--credentials"; else printf '%s\n' "-u"; fi
          }

          solr_name_flag() {
            if solr_10_cli; then printf '%s\n' "--conf-name"; else printf '%s\n' "-n"; fi
          }

          solr_dir_flag() {
            if solr_10_cli; then printf '%s\n' "--conf-dir"; else printf '%s\n' "-d"; fi
          }

          # Wait for Solr to be reachable (with or without auth)
          until curl -fsS -u "$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASS" "$$SOLR_URL/solr/admin/info/system" >/dev/null 2>&1 || curl -fsS "$$SOLR_URL/solr/admin/info/system" >/dev/null 2>&1; do
            sleep 2
          done

          # Wait for all 3 Solr nodes to join the cluster
          until [ "$$(curl -fsS -u "$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASS" "$$SOLR_URL/solr/admin/collections?action=CLUSTERSTATUS&wt=json" 2>/dev/null | grep -o '"[^"]*:8983_solr"' | sort -u | wc -l | tr -d '[:space:]')" -ge 3 ] 2>/dev/null || \
                [ "$$(curl -fsS "$$SOLR_URL/solr/admin/collections?action=CLUSTERSTATUS&wt=json" 2>/dev/null | grep -o '"[^"]*:8983_solr"' | sort -u | wc -l | tr -d '[:space:]')" -ge 3 ] 2>/dev/null; do
            sleep 2
          done

          # --- Security: Bootstrap BasicAuth + RBAC ---
          # Solr 9.7 BasicAuthPlugin requires >=1 user with hashed password
          # at load time, so we use "solr auth enable" which handles hashing.

          # Check if security is already bootstrapped
          AUTH_RESP=$$(curl -sS "$$SOLR_URL/solr/admin/authentication" 2>/dev/null || true)
          if echo "$$AUTH_RESP" | grep -qi 'No authentication'; then
            echo "Bootstrapping Solr security..."
            echo '{}' > /var/solr/empty-security.json
            solr zk cp file:/var/solr/empty-security.json zk:/security.json "$$(solr_zk_host_flag)" "$$ZK_HOST"
            sleep 2

            solr auth enable --type basicAuth \
              "$$(solr_credentials_flag)" "$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASS" \
              --block-unknown false \
              --solr-include-file /dev/null \
              "$$(solr_zk_host_flag)" "$$ZK_HOST"

            echo "Waiting for Solr to load security config..."
            sleep 5

            # NOTE: solr auth enable (Solr 9.7) already assigns the admin user
            # all built-in roles: ["superadmin", "admin", "search", "index"].
            # Do NOT overwrite with set-user-role — that strips superadmin/search.

            echo "Adding readonly user..."
            curl -fsS -u "$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASS" \
              "$$SOLR_URL/solr/admin/authentication" \
              -H 'Content-Type: application/json' \
              -d '{"set-user": {"'"$$SOLR_READONLY_USER"'": "'"$$SOLR_READONLY_PASS"'"}}'

            # Assign search role (Solr 9.7 built-in role for read + collection-admin-read)
            curl -fsS -u "$$SOLR_ADMIN_USER:$$SOLR_ADMIN_PASS" \
              "$$SOLR_URL/solr/admin/authorization" \
              -H 'Content-Type: application/json' \
              -d '{"set-user-role": {"'"$$SOLR_READONLY_USER"'": ["search"]}}'

            echo "Security bootstrap complete."
          else
            echo "Security already configured, skipping bootstrap."
          fi

          # --- Validate SOLR_NUM_SHARDS and SOLR_REPLICATION_FACTOR ---
          NUM_SHARDS="$${SOLR_NUM_SHARDS:-1}"
          REPLICATION_FACTOR="$${SOLR_REPLICATION_FACTOR:-3}"

          if ! echo "$$NUM_SHARDS" | grep -qE '^[1-9][0-9]*$$'; then
            echo "ERROR: Invalid SOLR_NUM_SHARDS: '$$NUM_SHARDS'. Expected a positive integer." >&2
            exit 1
          fi

          if ! echo "$$REPLICATION_FACTOR" | grep -qE '^[1-9][0-9]*$$'; then
            echo "ERROR: Invalid SOLR_REPLICATION_FACTOR: '$$REPLICATION_FACTOR'. Expected a positive integer." >&2
            exit 1
          fi

          if [ "$$REPLICATION_FACTOR" -gt 3 ]; then
            echo "WARNING: SOLR_REPLICATION_FACTOR=$$REPLICATION_FACTOR exceeds the default 3-node topology. Ensure you have enough Solr nodes." >&2
          fi

          CONFIGSET_DIR="/configsets/books"
          if [ "$$(solr_major_version)" = "9" ]; then
            CONFIGSET_DIR="/var/solr/books-configset-solr9"
            mkdir -p "$$CONFIGSET_DIR"
            cp -R /configsets/books/. "$$CONFIGSET_DIR"/
            sed -i \
              -e 's/hnswM="/hnswMaxConnections="/g' \
              -e 's/hnswEfConstruction="/hnswBeamWidth="/g' \
              -e 's/class="solr.ScalarQuantizedDenseVectorField"/class="solr.DenseVectorField"/g' \
              -e 's/ bits="[47]"/ vectorEncoding="BYTE"/g' \
              "$$CONFIGSET_DIR/managed-schema.xml"
            sed -i \
              -e 's/<luceneMatchVersion>10\.0<\/luceneMatchVersion>/<luceneMatchVersion>9.10<\/luceneMatchVersion>/g' \
              "$$CONFIGSET_DIR/solrconfig.xml"
          elif [ "$${VECTOR_QUANTIZATION:-none}" != "int8" ]; then
            CONFIGSET_DIR="/var/solr/books-configset-solr10"
            mkdir -p "$$CONFIGSET_DIR"
            cp -R /configsets/books/. "$$CONFIGSET_DIR"/
            sed -i \
              -e '/<fieldType name="knn_vector_768_byte"/d' \
              -e '/<field name="embedding_byte_v"/d' \
              "$$CONFIGSET_DIR/managed-schema.xml"
          fi

          if ! solr zk ls /configs "$$(solr_zk_host_flag)" "$$ZK_HOST" | grep -qx 'books'; then
            solr zk upconfig "$$(solr_zk_host_flag)" "$$ZK_HOST" "$$(solr_name_flag)" books "$$(solr_dir_flag)" "$$CONFIGSET_DIR"
          fi

          if ! curl -fsS -u "$$SOLR_AUTH_USER:$$SOLR_AUTH_PASS" "$$SOLR_URL/solr/admin/collections?action=LIST&wt=json" | grep -q '"books"'; then
            curl -fsS -u "$$SOLR_AUTH_USER:$$SOLR_AUTH_PASS" "$$SOLR_URL/solr/admin/collections?action=CREATE&name=books&collection.configName=books&numShards=$$NUM_SHARDS&replicationFactor=$$REPLICATION_FACTOR&waitForFinalState=true&wt=json"
          fi

          SOLR_BASE_URL="$$SOLR_URL" SOLR_COLLECTION="books" SOLR_AUTH_USER="$$SOLR_AUTH_USER" SOLR_AUTH_PASS="$$SOLR_AUTH_PASS" sh /scripts/add-conf-overlay.sh

          echo "Solr init complete"
    networks:
      - default
    restart: "no"
volumes:
  thumbnail-data:

  rabbitmq-data:

  redis-data:
  document-data:
  collections-db:
  solr-data:
  solr-data2:
  solr-data3:
  zoo-data1_logs:
  zoo-data1_data:
  zoo-data1_datalog:
  zoo-data2_logs:
  zoo-data2_data:
  zoo-data2_datalog:
  zoo-data3_logs:
  zoo-data3_data:
  zoo-data3_datalog:
  zoo-backup:
networks:
  default:
